<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ob-havo • Chiroyli Dizayn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --text-light: rgba(255,255,255,0.85);
      --shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      background-attachment: fixed;
      transition: background 1.2s ease;
    }

    .night {
      --bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }

    .container {
      max-width: 520px;
      margin: 60px auto;
      padding: 0 20px;
    }
        
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .tagline {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-top: 8px;
    }

    .search-container {
      position: relative;
      margin-bottom: 50px;
    }

    .search-box {
      display: flex;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    input {
      flex: 1;
      padding: 18px 28px;
      border: none;
      background: transparent;
      color: white;
      font-size: 1.15rem;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      padding: 0 32px;
      border: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.15));
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      background: rgba(255,255,255,0.35);
    }

    .weather-display {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
      text-align: center;
      display: none;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .city-name {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .current-time {
      font-size: 1.05rem;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .main-weather {
      font-size: 9rem;
      line-height: 0.9;
      margin: 20px 0 10px;
      font-weight: 300;
    }

    .description {
      font-size: 1.7rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .feels-like {
      font-size: 1.3rem;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 20px 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .stat-icon {
      font-size: 2rem;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 600;
    }

    .stat-label {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .error-msg {
      text-align: center;
      font-size: 1.4rem;
      margin: 80px 20px;
      padding: 30px;
      background: rgba(255, 100, 100, 0.15);
      border-radius: 20px;
      border: 1px solid rgba(255,100,100,0.3);
      display: none;
    }

    .loading {
      text-align: center;
      font-size: 1.5rem;
      margin: 120px 0;
      opacity: 0.9;
    }

    @media (max-width: 500px) {
      h1 { font-size: 2.6rem; }
      .main-weather { font-size: 7rem; }
      .weather-display { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Ob-havo</h1>
    <div class="tagline">Zamonaviy • Tez • Chiroyli</div>
  </header>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Shahar nomini yozing... (masalan: Toshkent)" autocomplete="off"/>
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="loading" id="loading">Ma'lumotlar yuklanmoqda...</div>

  <div class="weather-display" id="weatherDisplay">
    <div class="city-name" id="city"></div>
    <div class="current-time" id="time"></div>

    <div class="main-weather" id="temp"></div>
    <div class="description" id="desc"></div>
    <div class="feels-like" id="feels"></div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-tint"></i></div>
        <div class="stat-value" id="humidity">—</div>
        <div class="stat-label">Namlik</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-wind"></i></div>
        <div class="stat-value" id="wind">—</div>
        <div class="stat-label">Shamol</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-cloud-rain"></i></div>
        <div class="stat-value" id="precip">—</div>
        <div class="stat-label">Yomg‘ir</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-eye-low-vision"></i></div>
        <div class="stat-value" id="condition">—</div>
        <div class="stat-label">Holati</div>
      </div>
    </div>
  </div>

  <div class="error-msg" id="error">Shaharni topib bo‘lmadi 😔<br>Iltimos, nomini to‘g‘ri kiriting</div>
</div>

<script>
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const weatherDisplay = document.getElementById('weatherDisplay');
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('error');

  const cityEl    = document.getElementById('city');
  const timeEl    = document.getElementById('time');
  const tempEl    = document.getElementById('temp');
  const descEl    = document.getElementById('desc');
  const feelsEl   = document.getElementById('feels');
  const humidEl   = document.getElementById('humidity');
  const windEl    = document.getElementById('wind');
  const precipEl  = document.getElementById('precip');
  const condEl    = document.getElementById('condition');

  const weatherMap = {
    0:   { emoji: "☀️", text: "Ochiq osmon" },
    1:   { emoji: "🌤️", text: "Asosan ochiq" },
    2:   { emoji: "⛅", text: "Qisman bulutli" },
    3:   { emoji: "☁️", text: "Bulutli" },
    45:  { emoji: "🌫️", text: "Tuman" },
    51:  { emoji: "🌦️", text: "Yengil yomg‘ir" },
    61:  { emoji: "🌧️", text: "Yomg‘ir" },
    71:  { emoji: "❄️", text: "Qor" },
    80:  { emoji: "⛈️", text: "Kuchli yomg‘ir" },
  };

  async function fetchWeather(city) {
    try {
      loading.style.display = 'block';
      weatherDisplay.style.display = 'none';
      errorMsg.style.display = 'none';

      const geo = await fetch(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=uz`
      ).then(r => r.json());

      if (!geo.results?.length) throw new Error("Shahar topilmadi");

      const { latitude, longitude, name, timezone } = geo.results[0];

      const url = `https://api.open-meteo.com/v1/forecast?` +
                  `latitude=${latitude}&longitude=${longitude}` +
                  `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,is_day` +
                  `&timezone=${encodeURIComponent(timezone)}`;

      const data = await fetch(url).then(r => r.json());
      const now = data.current;

      cityEl.textContent = name;
      timeEl.textContent = new Date(now.time).toLocaleString('uz-UZ', {
        weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
      });

      const code = now.weather_code;
      const w = weatherMap[code] || { emoji: "🌍", text: "Noma'lum" };

      tempEl.textContent = Math.round(now.temperature_2m) + "°";
      descEl.textContent = w.emoji + "  " + w.text;
      feelsEl.textContent = `His qilinishi: ${Math.round(now.apparent_temperature)}°C`;
      humidEl.textContent = now.relative_humidity_2m + "%"; 
      windEl.textContent = Math.round(now.wind_speed_10m || 0) + " km/soat";
      precipEl.textContent = now.precipitation + " mm";
      condEl.textContent = w.text;

      document.body.classList.toggle('night', now.is_day === 0);

      weatherDisplay.style.display = 'block';
    } catch (err) {
      errorMsg.style.display = 'block';
      console.error(err);
    } finally {
      loading.style.display = 'none';
    }
  }

  searchBtn.addEventListener('click', () => {
    const val = cityInput.value.trim();
    if (val) fetchWeather(val);
  });

  cityInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchBtn.click();
  });

</script>
</body>
</html>
